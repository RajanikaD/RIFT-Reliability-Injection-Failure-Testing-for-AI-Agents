[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rift"
version = "0.1.0"
description = "Reliability injection and failure testing for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "mypy>=1.13,<2",
    "ruff>=0.9,<1",
]

[project.scripts]
rift = "rift_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = [
    "apps/api/src/rift_api",
    "apps/cli/src/rift_cli",
    "examples/commerce_demo/src/commerce_demo",
    "packages/rift_agent_adapters/src/rift_agent_adapters",
    "packages/rift_core/src/rift_core",
    "packages/rift_experiment_runner/src/rift_experiment_runner",
    "packages/rift_fault_engine/src/rift_fault_engine",
    "packages/rift_invariant_engine/src/rift_invariant_engine",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [
    "apps/api/src",
    "apps/cli/src",
    "examples/commerce_demo/src",
    "packages/rift_agent_adapters/src",
    "packages/rift_core/src",
    "packages/rift_experiment_runner/src",
    "packages/rift_fault_engine/src",
    "packages/rift_invariant_engine/src",
    "tests",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "apps/api/src",
    "apps/cli/src",
    "examples/commerce_demo/src",
    "packages/rift_agent_adapters/src",
    "packages/rift_core/src",
    "packages/rift_experiment_runner/src",
    "packages/rift_fault_engine/src",
    "packages/rift_invariant_engine/src",
]
packages = [
    "commerce_demo",
    "rift_agent_adapters",
    "rift_api",
    "rift_cli",
    "rift_core",
    "rift_experiment_runner",
    "rift_fault_engine",
    "rift_invariant_engine",
]
