name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          python-version: ${{ matrix.python-version }}
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Demo smoke test
        run: uv run rift run --agent reconciling --fault refund-timeout-after-commit --strict --no-trace
      - name: Build distributions
        run: uv build
      - name: Wheel contains the scenario fixture
        run: unzip -l dist/*.whl | grep -q "commerce_demo/fixtures/initial_state.json"

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t rift-api:ci .
      - name: Image runs as a non-root user
        run: test "$(docker run --rm rift-api:ci id -u)" = "10001"
      - name: Health endpoint responds
        run: |
          docker run -d --name rift-api -p 8000:8000 rift-api:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs rift-api
          exit 1
      - name: CLI runs inside the image
        run: docker run --rm rift-api:ci rift run --agent reconciling --fault refund-timeout-after-commit --strict --no-trace
